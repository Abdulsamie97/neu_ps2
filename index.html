<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langium's Hello World in the Web</title>
    <link rel="stylesheet" href="packages/web/style.css" />
  </head>

  <body>
    <div class="exampleHeadlineDiv">
      <b class="exampleHeadline">
        Helloworld Client & Language Server (Worker)

      import { runDsl } from "./packages/web/src/main.ts";

    <b>Summary:</b>

    <br />
