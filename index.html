<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo2 Web Runner</title>
    <link rel="stylesheet" href="packages/web/style.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="toolbar">
        <div class="brand">
          <b>Pseudo2 Runner</b>
          <span>Editor, Validierung und Ausgabe im Browser</span>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="button-start">Start</button>
          <button type="button" id="button-dispose">Dispose</button>
          <button type="button" id="button-summary">Update Summary</button>
          <button type="button" id="button-code">Update Code</button>
          <button type="button" id="button-save">Save Code</button>
          <button type="button" id="button-execute">Execute</button>
          <span id="save-status" class="status-pill" aria-live="polite"></span>
        </div>
      </header>

      <main class="workspace-layout">
        <section class="editor-pane" aria-label="Pseudo2 editor">
          <div class="pane-header">
            <span>Editor</span>
          </div>
          <div id="monaco-editor-root"></div>
        </section>

        <aside class="output-pane" aria-label="Ausgabe">
          <section class="output-section output-primary">
            <div class="pane-header">
              <span>Execution</span>
            </div>
            <pre id="exespan"> -no execution yet- </pre>
          </section>

          <details class="output-section">
            <summary>Generated JavaScript</summary>
            <pre id="generatedspan"> -not generated yet- </pre>
          </details>

          <section class="output-section">
            <div class="pane-header">
              <span>Summary</span>
            </div>
            <pre id="summaryspan"> -nothing yet- </pre>
          </section>

          <details class="output-section">
            <summary>Current Pseudo2 Code</summary>
            <pre id="codespan"> -no code yet- </pre>
          </details>
        </aside>
      </main>
    </div>

    <script type="module">
      import { runDsl } from "./packages/web/src/main.ts";

      runDsl();
    </script>
  </body>
</html>
