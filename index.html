<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo2 JavaScript Runner</title>
    <link rel="stylesheet" href="packages/web/style.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="toolbar">
        <div class="brand">
          <div class="brand-title">
            <b>Pseudo2 JavaScript Runner</b>
            <span id="language-version" class="language-version" aria-label="Pseudo2-Sprachversion"></span>
          </div>
          <span>Editor, Validierung, Generierung und Ausführung im Browser</span>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="button-start">Editor starten</button>
          <button type="button" id="button-dispose">Editor stoppen</button>
          <button type="button" id="button-summary">Zusammenfassung</button>
          <button type="button" id="button-code">Quelltext</button>
          <button type="button" id="button-save">Pseudo2 speichern</button>
          <button type="button" id="button-execute">JavaScript ausführen</button>
          <button type="button" id="button-debug" disabled>Debuggen</button>
          <span id="save-status" class="status-pill" aria-live="polite"></span>
        </div>
      </header>

      <main class="workspace-layout runner-layout">
        <section class="editor-pane" aria-label="Pseudo2 editor">
          <div class="pane-header">
            <span>Editor</span>
          </div>
          <div id="monaco-editor-root"></div>
        </section>

        <aside class="output-pane" aria-label="Ausgabe">
          <section class="output-section debug-section" aria-label="JavaScript-Debugger">
            <div class="debug-controls">
              <button type="button" id="debug-continue" title="Bis zum naechsten Haltepunkt fortsetzen" disabled>Weiter</button>
              <button type="button" id="debug-step" title="In die naechste Pseudo2-Anweisung hineingehen" disabled>Hinein</button>
              <button type="button" id="debug-over" title="Aufruf ausfuehren und danach anhalten" disabled>Darueber</button>
              <button type="button" id="debug-out" title="Aktuelle Funktion verlassen" disabled>Heraus</button>
              <button type="button" id="debug-stop" title="Debug-Lauf beenden" disabled>Stop</button>
              <span id="debug-status" role="status" aria-live="polite">Kein Debug-Lauf.</span>
            </div>
          </section>
          <section class="output-section output-primary">
            <div class="pane-header">
              <span>JavaScript-Ausgabe</span>
            </div>
            <pre id="exespan"> -no execution yet- </pre>
          </section>

          <section class="output-section">
            <details open>
              <summary>Variablen</summary>
              <div id="variable-list" class="variable-list" aria-live="polite">Noch nicht ausgefuehrt.</div>
            </details>
          </section>

          <details class="output-section">
            <summary>Generiertes JavaScript</summary>
            <pre id="generatedspan"> -not generated yet- </pre>
          </details>

          <section class="output-section">
            <div class="pane-header">
              <span>Zusammenfassung</span>
            </div>
            <pre id="summaryspan"> -nothing yet- </pre>
          </section>

          <details class="output-section">
            <summary>Aktueller Pseudo2-Code</summary>
            <pre id="codespan"> -no code yet- </pre>
          </details>
        </aside>
      </main>
    </div>

    <script type="module">
      import { runDsl } from "./packages/web/src/main.ts";

      void runDsl().then(() => {
        document.querySelector('#button-start')?.click();
      });
    </script>
  </body>
</html>
